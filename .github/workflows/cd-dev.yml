name: Despliegue Continuo - Desarrollo (CD)

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy-dev:
    name: Desplegar a entorno de Desarrollo
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar artefacto
        run: javac -d build/classes src/main/java/ecuacionsegundogradomain/Main.java

      - name: Empaquetar version
        run: |
          mkdir -p dist
          cd build/classes
          jar cf ../../dist/motor-calculo-${{ github.sha }}.jar .
          cd ../..

      - name: Publicar artefacto versionado
        uses: actions/upload-artifact@v4
        with:
          name: motor-calculo-dev-${{ github.sha }}
          path: dist/motor-calculo-${{ github.sha }}.jar

      - name: Simular despliegue a Desarrollo
        run: |
          echo "Desplegando motor-calculo-${{ github.sha }}.jar"
          echo "Entorno: DESARROLLO"
          echo "Despliegue finalizado correctamente"
